name: 무료주차 자동등록 (매주 일요일 12시)

on:
  # GitHub Actions 스케줄은 정시(:00)에 몰려 지연이 잦음 — 정각을 피하고
  # 입차 대상을 못 찾으면 조용히 재시도하도록 창(11:50~13:00 KST)에 여러 번 배치.
  # (cron-register.ts는 등록 대상을 실제로 찾은 시점에만 하루 1회 락을 걸므로 중복 등록 없음)
  schedule:
    - cron: '43 2 * * 0'   # UTC 02:43 = KST 11:43
    - cron: '7 3 * * 0'    # UTC 03:07 = KST 12:07
    - cron: '26 3 * * 0'   # UTC 03:26 = KST 12:26
    - cron: '51 3 * * 0'   # UTC 03:51 = KST 12:51
  workflow_dispatch:        # 수동 실행 (테스트용)

jobs:
  auto-register:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 무료주차 자동 조회·등록
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/cron-register.ts
